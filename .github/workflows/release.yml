name: Release an integration

# Publishes a GitHub release of a Go integration's program, by the rule every integration
# follows, so a reader installs any of them the same way (README §Release rule). An
# integration on another forge publishes the same files with that forge's own CI. An
# integration on GitHub calls it from a workflow that runs on its tags:
#
#   on:
#     push:
#       tags: ["v*"]
#   jobs:
#     release:
#       if: ${{ github.server_url == 'https://github.com' }}
#       permissions:
#         contents: write
#       uses: qoryai/integrations/.github/workflows/release.yml@v0.2.0
#       with:
#         program: acme-tracker
#
# It builds the program from ./cmd/<program> for Linux and macOS, amd64 and arm64, with
# its version set to the tag's, and publishes <program>_<version>_<os>_<arch>.tar.gz with
# the program at the archive's root, description.json, what `<program> describe` prints,
# and checksums.txt, the SHA-256 of each archive and of description.json. A control plane
# fetches description.json from the release to learn the integration without running it.
# The release's body is the version's section of CHANGELOG.md, "## [X.Y.Z] - YYYY-MM-DD":
# a tag without one publishes nothing. Neither does a program whose describe fails or
# prints anything but one JSON object with version 1 and the tag's version, without its
# v, as program_version. Nor does one whose description fails conformance.Description:
# the release runs `go run github.com/qoryai/integrations/cmd/integration-conformance` in
# the integration's own module, with the version of this module its go.mod requires. A
# go.mod that does not require github.com/qoryai/integrations, or requires a version
# without cmd/integration-conformance, publishes nothing.

on:
  workflow_call:
    inputs:
      program:
        description: The program's name, such as qory-github or acme-tracker.
        required: true
        type: string
      main:
        description: The Go package of the program's command; empty is ./cmd/<program>.
        required: false
        type: string
        default: ""

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Take the release body from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\] " { found = 1; next }
            found && /^## / { exit }
            found && /^\[/ && /\]: / { exit }
            found { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' >"$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "CHANGELOG.md has no section [$version]; add one before tagging $TAG" >&2
            exit 1
          fi

      - name: Write the build's configuration
        env:
          PROGRAM: ${{ inputs.program }}
          MAIN: ${{ inputs.main }}
        run: |
          case "$PROGRAM" in
            "" | *[!a-z0-9_-]*) echo "program must be a program's name, a-z, 0-9, _ and -: \"$PROGRAM\"" >&2; exit 1 ;;
          esac
          main="${MAIN:-./cmd/$PROGRAM}"
          files=""
          for f in README.md LICENSE NOTICE TRADEMARKS.md CHANGELOG.md; do
            if [ -f "$f" ]; then files="${files:+$files, }$f"; fi
          done
          cat >"$RUNNER_TEMP/goreleaser.yaml" <<EOF
          version: 2
          project_name: $PROGRAM
          before:
            hooks:
              - go mod download
              - go test ./...
          builds:
            - id: $PROGRAM
              main: $main
              binary: $PROGRAM
              env: [CGO_ENABLED=0]
              goos: [darwin, linux]
              goarch: [amd64, arm64]
              flags: [-trimpath]
              ldflags:
                - -s -w -X main.version={{ .Version }}
          archives:
            - id: $PROGRAM
              formats: [tar.gz]
              name_template: "${PROGRAM}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
              files: [$files]
          checksum:
            name_template: checksums.txt
            extra_files:
              - glob: "$RUNNER_TEMP/description.json"
          changelog:
            use: github
            sort: asc
          release:
            prerelease: auto
            extra_files:
              - glob: "$RUNNER_TEMP/description.json"
          EOF

      - name: Describe the program
        # The same build as the release's, for the runner's own platform, so describe
        # reports the version the archives' programs report.
        env:
          PROGRAM: ${{ inputs.program }}
          MAIN: ${{ inputs.main }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          main="${MAIN:-./cmd/$PROGRAM}"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$RUNNER_TEMP/bin/$PROGRAM" "$main"
          "$RUNNER_TEMP/bin/$PROGRAM" describe >"$RUNNER_TEMP/description.json"
          if ! jq -se 'length == 1 and (.[0] | type == "object")' "$RUNNER_TEMP/description.json" >/dev/null; then
            echo "$PROGRAM describe prints no single JSON object" >&2
            exit 1
          fi
          if ! jq -e '.version == 1' "$RUNNER_TEMP/description.json" >/dev/null; then
            echo "describe reports version $(jq -c .version "$RUNNER_TEMP/description.json"), the contract's is 1" >&2
            exit 1
          fi
          if ! jq -e --arg v "$version" '.program_version == $v' "$RUNNER_TEMP/description.json" >/dev/null; then
            echo "describe reports program_version $(jq -c .program_version "$RUNNER_TEMP/description.json"), the tag is $TAG" >&2
            exit 1
          fi

      - name: Check the description against the contract
        # Runs conformance.Description in the integration's own module, so the check uses
        # the version of qoryai/integrations the integration's tests use.
        env:
          PROGRAM: ${{ inputs.program }}
        run: |
          module=github.com/qoryai/integrations
          if ! go list -m "$module" >/dev/null 2>&1; then
            echo "go.mod must require $module: the release checks the description with its conformance package" >&2
            exit 1
          fi
          if ! go list "$module/cmd/integration-conformance" >/dev/null 2>"$RUNNER_TEMP/go-list.txt"; then
            echo "go.mod requires $module $(go list -m -f '{{.Version}}' "$module"); the release runs its cmd/integration-conformance, which go cannot build here:" >&2
            cat "$RUNNER_TEMP/go-list.txt" >&2
            exit 1
          fi
          if ! go run "$module/cmd/integration-conformance" <"$RUNNER_TEMP/description.json"; then
            echo "$PROGRAM describe prints a description the contract refuses" >&2
            exit 1
          fi

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --config ${{ runner.temp }}/goreleaser.yaml --release-header=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
