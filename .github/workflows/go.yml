name: Go

# The checks every Go integration runs; this repository's CI runs them too. An
# integration calls it from its CI:
#
#   jobs:
#     go:
#       uses: qoryai/integrations/.github/workflows/go.yml@v0.3.0
#
# It checks out the calling repository and runs its formatting, vet, tests and build, and
# its doc comments against the revive.toml at its root. The template's CI calls it this way.

on:
  workflow_call:

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    env:
      # The image's Go is 1.27.2 and sets GOTOOLCHAIN=local; this module needs 1.27.3 or
      # later. Go runs at least go1.27.3, and a newer one when go.mod requires it. Remove
      # this line once the digest below is of a go1.27.3 image.
      GOTOOLCHAIN: go1.27.3+auto
    container:
      # Docker Hub's official golang:1.27, copied by digest to qoryai's public package. It
      # is pulled without a login, because the package is public, so a calling repository
      # grants this workflow nothing more.
      image: ghcr.io/qoryai/ci-images:golang-1.27@sha256:e432b43af23a9328d56a7c499be0476810aa344acbcf65fc7c455d4ff5a40602
    steps:
      - name: Install node for the JavaScript actions
        # checkout@v7 runs on node 24; the image has none.
        env:
          NODE_VERSION: 24.20.0
        run: |
          case "$(uname -m)" in aarch64) arch=arm64 ;; x86_64) arch=x64 ;; *) echo "unsupported arch" >&2; exit 1 ;; esac
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${arch}.tar.gz" \
            | tar -xz -C /usr/local --strip-components=1
          node --version

      - uses: actions/checkout@v7

      - name: Trust the checkout
        # The checkout belongs to the runner user, the container runs as root, and git
        # refuses to read a repository it sees as someone else's.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore the module cache
        uses: actions/cache@v6
        with:
          path: /go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Find the build cache
        id: go-env
        # go keeps it under HOME, which the runner sets for the container.
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "goversion=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Restore the build cache
        # Each passing run saves a fresh cache, so the cache keeps up with the code. A build
        # cache from another Go version holds nothing this one can use.
        uses: actions/cache@v6
        with:
          path: ${{ steps.go-env.outputs.gocache }}
          key: go-build-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        # What a program prints is validated against the contracts' schemas.
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Check doc comments
        run: go run github.com/mgechev/revive@v1.16.0 -config revive.toml -set_exit_status ./...
